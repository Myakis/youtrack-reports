<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Градиенты для фона в фирменном стиле JetBrains -->
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3184" />
      <stop offset="100%" stop-color="#E4005B" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A7EE" />
      <stop offset="100%" stop-color="#007ACC" />
    </linearGradient>
    <!-- Мягкая тень под центральным квадратом -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- ФОНОВАЯ ФИГУРА (Стилизованный крест/икс) -->
  <g transform="translate(400, 400)">
    <!-- Розовые лепестки (наклонены влево) -->
    <path d="M 0,0 L -120,-180 A 100,100 0 0,1 40,-290 L 160,-110 Z" fill="url(#pinkGrad)" transform="rotate(-15)" />
    <path d="M 0,0 L 120,180 A 100,100 0 0,1 -40,290 L -160,110 Z" fill="url(#pinkGrad)" transform="rotate(-15)" />
    
    <!-- Голубые лепестки (наклонены вправо) -->
    <path d="M 0,0 L 180,-120 A 100,100 0 0,1 290,40 L 110,160 Z" fill="url(#blueGrad)" transform="rotate(15)" />
    <path d="M 0,0 L -180,120 A 100,100 0 0,1 -290,-40 L -110,-160 Z" fill="url(#blueGrad)" transform="rotate(15)" />
  </g>

  <!-- ЦЕНТРАЛЬНЫЙ КВАДРАТ ИКОНКИ -->
  <rect x="240" y="240" width="320" height="320" rx="16" fill="#19191C" filter="url(#dropShadow)" />

  <!-- ТЕКСТ И СИМВОЛЫ (YT) -->
  <!-- Буква Y -->
  <path d="M 280,295 L 330,380 L 330,445 L 365,445 L 365,380 L 415,295 L 375,295 L 348,350 L 320,295 Z" fill="#FFFFFF" />
  <!-- Буква T -->
  <path d="M 430,295 L 520,295 L 520,330 L 493,330 L 493,445 L 457,445 L 457,330 L 430,330 Z" fill="#FFFFFF" />
  <!-- Нижнее подчеркивание (курсор) -->
  <rect x="280" y="475" width="85" height="16" fill="#FFFFFF" />

  <!-- ЭЛЕМЕНТ ОТЧЕТА (Стилизованная диаграмма) -->
  <!-- Белая мини-панель -->
  <rect x="420" y="465" width="100" height="35" rx="6" fill="#FFFFFF" />
  <!-- Три столбца диаграммы внутри панели -->
  <rect x="435" y="482" width="12" height="10" rx="2" fill="#00A7EE" />
  <rect x="455" y="474" width="12" height="18" rx="2" fill="#FF3184" />
  <rect x="475" y="471" width="12" height="21" rx="2" fill="#19191C" />
</svg>
