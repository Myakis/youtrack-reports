# Проверка на каждый пуш и пул-реквест: типы, тесты, сборка. Готовые пакеты — в артефактах запуска.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Код расширения — в папке app; README, CHANGELOG и .github — в корне
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: trackdesk-${{ github.sha }}
          path: |
            app/release/*.zip
            app/release/*.xpi
          retention-days: 14
